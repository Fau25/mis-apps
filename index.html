<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<title>Mis apps</title>
<meta name="theme-color" content="#F3EEF1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="preload" href="fuentes/sans-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fuentes/sans-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<nav id="barra" aria-label="Apps">
  <button id="logo" class="logo" type="button" aria-label="Inicio">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg>
  </button>
  <div id="lista"></div>
  <div class="hueco"></div>
  <button id="btnScripts" class="app" type="button" aria-label="Scripts y contraseñas" aria-expanded="false" aria-controls="cajon">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
  </button>
</nav>

<main id="panel">
  <section id="inicio" aria-labelledby="saludo">
    <div class="ancho">
      <header class="cab">
        <div class="titulo">
          <h1 id="saludo">Inicio</h1>
          <span id="fecha"></span>
        </div>
        <label class="buscar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"/></svg>
          <span class="oculto">Buscar app</span>
          <input id="buscar" type="search" placeholder="Buscar app" autocomplete="off" spellcheck="false">
          <kbd aria-hidden="true">/</kbd>
        </label>
        <button id="abrirScripts" class="redondo grande" type="button" aria-label="Scripts y contraseñas" title="Scripts y contraseñas">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
        </button>
      </header>
      <div class="subcab">
        <h2>Mis apps</h2>
        <span id="cuenta"></span>
      </div>
      <div id="rejilla" class="rejilla"></div>
      <p id="sinResultados" class="vacio" hidden>Ninguna app coincide con la búsqueda.</p>
    </div>
  </section>

  <section id="vistaApp" hidden>
    <header class="barraApp">
      <button id="volverApp" class="redondo" type="button" aria-label="Volver a mis apps" title="Volver">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="titulo">
        <h1 id="nombre"></h1>
        <span id="dir"></span>
      </div>
      <button id="recargar" class="redondo grande" type="button" aria-label="Recargar" title="Recargar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>
      </button>
      <button id="aparte" class="redondo grande" type="button" aria-label="Abrir en otra pestaña" title="Abrir en otra pestaña">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg>
      </button>
    </header>
    <div id="marco">
      <p id="cargando" hidden>Cargando…</p>
    </div>
  </section>
</main>

<nav id="navMovil" aria-label="Menú">
  <button id="nInicio" class="nb activo" type="button" aria-label="Inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg><span>Inicio</span></button>
  <button id="nBuscar" class="nb" type="button" aria-label="Buscar app"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"/></svg><span>Buscar</span></button>
  <button id="nScripts" class="nb" type="button" aria-label="Scripts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span>Scripts</span></button>
</nav>

<div id="velo" hidden></div>
<aside id="cajon" role="dialog" aria-modal="true" aria-labelledby="tituloCajon" hidden>
  <header class="cabCajon">
    <div class="titulo">
      <h2 id="tituloCajon">Scripts</h2>
      <span id="cuentaScripts"></span>
    </div>
    <button id="cerrarCajon" class="redondo" type="button" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>
  <label class="buscar enCajon">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"/></svg>
    <span class="oculto">Buscar script</span>
    <input id="buscarScript" type="search" placeholder="Buscar" autocomplete="off" spellcheck="false">
  </label>
  <div id="filas" class="filas"></div>
  <p class="notaCajon">Direcciones y contraseñas se guardan solo en este dispositivo.</p>
  <div class="pieCajon">
    <div class="pieDos">
      <button id="exportar" class="pildora sec" type="button">Exportar</button>
      <button id="importar" class="pildora sec" type="button">Importar</button>
      <input id="archivoImportar" type="file" accept=".json,application/json" hidden>
    </div>
    <button id="anadir" class="pildora oscura ancha" type="button">+ Añadir script</button>
  </div>
</aside>

<div id="aviso" role="status" hidden><span id="avisoTexto"></span><button id="deshacer" type="button" hidden>Deshacer</button></div>

<script src="app.js"></script>
</body>
</html>
